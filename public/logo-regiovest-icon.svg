
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1024" height="1024" fill="none">
  <defs>
    <!-- Background Gradient: Deep Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2042" />
      <stop offset="50%" stop-color="#0B1B3D" />
      <stop offset="100%" stop-color="#050E21" />
    </linearGradient>

    <!-- 3D Blue Gradient for Icon Emblem -->
    <linearGradient id="iconBlueGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="30%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Edge Specular Highlight -->
    <linearGradient id="iconEdgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Deep Ambient Drop Shadow -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E3A8A" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Dark Navy Squircle Background -->
  <rect width="1000" height="1000" rx="220" fill="url(#bgGrad)"/>
  <rect width="996" height="996" x="2" y="2" rx="218" stroke="#2563EB" stroke-opacity="0.35" stroke-width="4"/>

  <!-- 3D Extruded Blue Emblem -->
  <g filter="url(#iconShadow)">
    <path d="M 192 324 L 236 392 H 418 C 452 392 464 408 464 430 C 464 452 448 468 416 468 C 376 468 344 476 296 492 L 446 710 H 538 L 570 532 L 628 710 L 826 362 H 740 L 600 610 L 538 488 C 564 455 568 410 554 372 C 538 335 488 324 416 324 Z" transform="translate(0, 16)" fill="#020617" opacity="0.8" />
    <path d="M 192 324 L 236 392 H 418 C 452 392 464 408 464 430 C 464 452 448 468 416 468 C 376 468 344 476 296 492 L 446 710 H 538 L 570 532 L 628 710 L 826 362 H 740 L 600 610 L 538 488 C 564 455 568 410 554 372 C 538 335 488 324 416 324 Z" transform="translate(0, 10)" fill="#0F244F" opacity="0.9" />
    <path d="M 192 324 L 236 392 H 418 C 452 392 464 408 464 430 C 464 452 448 468 416 468 C 376 468 344 476 296 492 L 446 710 H 538 L 570 532 L 628 710 L 826 362 H 740 L 600 610 L 538 488 C 564 455 568 410 554 372 C 538 335 488 324 416 324 Z" transform="translate(0, 5)" fill="#1E3A8A" opacity="0.95" />
    
    <!-- Face with 3D Blue Gloss -->
    <path
      d="M 192 324 L 236 392 H 418 C 452 392 464 408 464 430 C 464 452 448 468 416 468 C 376 468 344 476 296 492 L 446 710 H 538 L 570 532 L 628 710 L 826 362 H 740 L 600 610 L 538 488 C 564 455 568 410 554 372 C 538 335 488 324 416 324 Z"
      fill="url(#iconBlueGrad)"
      stroke="url(#iconEdgeGlow)"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </g>
</svg>